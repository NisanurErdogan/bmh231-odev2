<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bozok Etkinlik Panosu</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="stil.css">
  <script src="betik.js" defer></script>
</head>
<body>
  <header class="ust-bant">
    <div class="logo">Bozok Etkinlik</div>
    <nav>
      <a href="#liste">Etkinlikler</a>
      <a href="#oner">Etkinlik Öner</a>
    </nav>
  </header>

  <main>
    <section id="liste" aria-labelledby="liste-baslik">
      <h1 id="liste-baslik">Kampüs Etkinlik Panosu</h1>

      <div class="arac-cubugu">
        <div class="filtreler" role="group" aria-label="Etkinlik türü">
          <button type="button" class="filtre secili" data-tur="tumu">Tümü</button>
          <button type="button" class="filtre" data-tur="atolye">Atölye</button>
          <button type="button" class="filtre" data-tur="soylesi">Söyleşi</button>
          <button type="button" class="filtre" data-tur="topluluk">Topluluk</button>
        </div>
        <div class="arama">
          <label for="arama">Başlıkta ara</label>
          <input type="search" id="arama" placeholder="Etkinlik adı yazın">
        </div>
      </div>

      <p id="durum" role="status"></p>
      <div id="kartlar" class="kartlar"></div>
    </section>

    <section id="oner" aria-labelledby="oner-baslik">
      <h2 id="oner-baslik">Etkinlik Öner</h2>
      <form id="oneri-formu" novalidate>
        <div class="alan">
          <label for="ad">Etkinlik adı</label>
          <input type="text" id="ad" name="ad">
        </div>
        <div class="alan">
          <label for="tarih">Tarih</label>
          <input type="date" id="tarih" name="tarih">
        </div>
        <div class="alan">
          <label for="eposta">E-posta</label>
          <input type="email" id="eposta" name="eposta">
        </div>
        <button type="submit">Öneriyi Gönder</button>
        <div id="form-mesaj" role="status"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Bozok Etkinlik</p>
  </footer>
</body>
</html>
